<ng-container *ngIf="characters && characters.length > 0; else elseTemplate">
  <div class="row g-3">
    <div
      class="col-12 col-sm-6 col-md-4 col-lg-3"
      *ngFor="let item of characters"
    >
      <app-ram-card [character]="item"></app-ram-card>
    </div>
  </div>
</ng-container>
<ng-template #elseTemplate>
  <div class="d-flex justify-content-center align-items-center h-100">
    <p class="text-center my-4">No hay personajes disponibles</p>
  </div>
</ng-template>
