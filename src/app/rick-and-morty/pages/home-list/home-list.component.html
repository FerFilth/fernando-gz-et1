<div class="container grid-home-page">
  <div class="row">
    <div class="col-12 col-md-6">
      <h1 class="mb-3">Wubba lubba dub dub!</h1>
      <p class="mb-3">Base de datos de personajes de Rick y Morty</p>
    </div>
  </div>
  <div class="grid-content">
    <div class="action-bar">
      <app-ram-input (item)="onSearch($event)"></app-ram-input>
      <div class="d-flex align-items-center justify-content-end">
        <span>Mis favoritos</span>
        <button
          class="btn d-flex align-items-center px-1 py-1 ms-2 favorite-button"
          [class.btn-primary]="showOnlyFavorites"
          [class.btn-outline-secondary]="!showOnlyFavorites"
          [class.is-active]="showOnlyFavorites"
          (click)="toggleFavorite()"
        >
          <span class="material-symbols-outlined favorite-icon"> star </span>
        </button>
      </div>
    </div>

    <div class="row grid-scroll-container">
      <div class="col-12">
        <div
          *ngIf="showOnlyFavorites && characters.length === 0"
          class="alert alert-info text-center mt-4"
        >
          <span
            class="material-symbols-outlined fs-1 d-block mb-2"
            style="font-variation-settings: 'FILL' 0"
            >star</span
          >
          <p class="mb-0">
            No tienes personajes favoritos aún. ¡Empieza a marcar tus favoritos!
          </p>
        </div>
        <app-ram-grid [characters]="characters"></app-ram-grid>
      </div>
    </div>

    <div class="row mt-1">
      <div class="col-12">
        <app-paginator></app-paginator>
      </div>
    </div>
  </div>
</div>
