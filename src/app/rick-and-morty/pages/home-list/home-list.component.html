<div class="container mt-2 mb-3">
  <div class="row mt-md-4">
    <div class="col-12 col-md-6">
      <h1 class="mb-3">Wubba lubba dub dub!</h1>
      <p class="mb-3">Base de datos de personajes de Rick y Morty</p>
    </div>
  </div>
  <div class="row">
    <div class="col-12 mb-3">
      <app-ram-input (item)="onSearch($event)"></app-ram-input>
    </div>
  </div>
  <div class="row">
    <div class="col-12">
      <div class="vh-100 overflow-auto px-2">
        <app-ram-grid [characters]="characters"></app-ram-grid>
      </div>
    </div>
  </div>
  <div class="row mt-3">
    <div class="col-12">
      <app-paginator></app-paginator>
    </div>
  </div>
</div>
